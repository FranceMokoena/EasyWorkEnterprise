<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" role="img" aria-labelledby="title desc">
  <title id="title">Easywork Enterprise</title>
  <desc id="desc">Easywork Enterprise logo with circular teal symbol, wordmark and the slogan We make it easy for our clients.</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f7180"/>
      <stop offset="0.48" stop-color="#6b8b8d"/>
      <stop offset="0.78" stop-color="#062f38"/>
      <stop offset="1" stop-color="#0c8997"/>
    </linearGradient>
    <linearGradient id="wedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d7079"/>
      <stop offset="1" stop-color="#111719"/>
    </linearGradient>
  </defs>
  <rect width="620" height="310" fill="#fff"/>
  <!-- distinctive circular Easywork mark -->
  <path d="M214 27 A126 126 0 1 0 231 273" fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round"/>
  <path d="M220 39 A113 113 0 0 0 112 185" fill="none" stroke="#0d8b98" stroke-width="4" opacity=".8"/>
  <!-- stylised E / directional wedge -->
  <path d="M105 112 L254 112 L228 143 L139 143 L139 151 L229 151 L214 174 L139 174 L139 184 L244 184 L213 216 L119 216 L92 178 L92 141 Z" fill="url(#wedge)"/>
  <!-- wordmark -->
  <text x="230" y="141" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="-2.5" fill="#111">ASYWORK</text>
  <text x="229" y="190" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="900" letter-spacing="-2.2" fill="#111">NTERPRISE</text>
  <rect x="412" y="154" width="166" height="13" rx="2" fill="#0c8997"/>
  <text x="480" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111">(Pty) Ltd</text>
  <!-- original slogan/message -->
  <text x="315" y="267" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic" fill="#176779">We make it easy for our clients</text>
</svg>